name: Build and Push Docker Image

on:
    push:
        branches:
            - feature/aws-docker-integration


jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
          - name: Checkout code
            uses: actions/checkout@v3
        
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v2

          - name: log in to Docker Hub
            uses: docker/login-action@v2
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

          - name: Build Docker image
            run: |
              docker build -t ${{secrets.DOCKER_USERNAME}}/node-app:v${{github.run_number}} .
          
          - name: Push Docker image
            run: |
              docker push ${{secrets.DOCKER_USERNAME}}/node-app:v${{github.run_number}}
    
    deploy:
      needs: build

      runs-on: ubuntu-latest

      steps:
         - name: Set up SSh keys
           run: |
             echo "${{secrets.EC2_SSH_KEY}}" > private_key.pem
             chmod 400 private_key.pem

         - name: Connect to EC2 and deploy
           run: |
             ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@ec2-52-72-128-117.compute-1.amazonaws.com << 'EOF'
                if ! command -v docker &> /dev/null
                then
                  sudo dnf install -y docker
                  sudo systemctl start docker
                  sudo systemctl enable docker
                fi
                sudo dnf install -y jq
                sudo yum install -y nginx
                sudo systemctl start nginx
                sudo systemctl enable nginx
                LATEST_TAG=$(curl -s https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/node-app/tags/?page_size=1 | jq -r '.results[0].name')
                sudo docker pull ${{ secrets.DOCKER_USERNAME }}/node-app:$LATEST_TAG
                sudo docker stop $(sudo docker ps -q)
                sudo docker rm -f $(sudo docker ps -aq)
                sudo docker run -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/node-app:$LATEST_TAG
             EOF